<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download Picdrop Android</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#0C1420;--panel:#121D2D;--text:#E6EEF8;--muted:#8AA0B8;--accent:#3BA7FF;color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .card{background:var(--panel);border-radius:18px;padding:28px 24px;max-width:360px;width:100%}
  h1{font-size:20px;margin:0 0 6px}
  p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 18px}
  a.btn{display:block;background:var(--accent);color:#04121F;text-decoration:none;font-weight:700;padding:14px;border-radius:12px}
</style>
</head>
<body>
<div class="card">
  <h1>💧 Picdrop Android</h1>
  <p id="msg">Menyiapkan download versi terbaru…</p>
  <a class="btn" id="dl" href="https://github.com/victivestudio-ux/picdrop-downloads/releases">Download APK</a>
</div>
<script>
  // Selalu ambil versi terbaru dari android-version.json, lalu langsung unduh.
  fetch("/android-version.json?t=" + Date.now(), {cache: "no-store"})
    .then(function(r){ return r.json(); })
    .then(function(j){
      document.getElementById("dl").href = j.url;
      document.getElementById("msg").textContent =
        "Versi terbaru v" + j.versionName + ". Download dimulai otomatis — kalau tidak, ketuk tombol di bawah. Install di atas aplikasi lama, tidak perlu uninstall.";
      location.replace(j.url);
    })
    .catch(function(){
      document.getElementById("msg").textContent = "Ketuk tombol di bawah untuk download.";
    });
</script>
</body>
</html>
